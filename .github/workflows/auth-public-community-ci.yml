name: Auth Public Community Hardening CI

on:
  push:
    branches: [auth-public-community-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-public-community-e2e:
    name: Role OTP, public experience and Community route E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate hardening source contracts
        run: |
          bash -n scripts/verify-production-otp-config.sh
          bash -n scripts/deploy-main-native-with-otp.sh
          test -s 'frontend/src/app/(admin)/admin/groups/page.tsx'
          test -s 'frontend/src/app/community/page.tsx'
          grep -q "Community" frontend/src/components/layout/GlobalTopbar.tsx
          grep -q "Education Community" frontend/src/components/public/PublicHomeExperience.tsx
          grep -q "sendOTP(mobile, role)" 'frontend/src/app/(auth)/login/page.tsx'
          ! grep -q 'disabled={otpSent}' 'frontend/src/app/(auth)/login/page.tsx'
          grep -q "role: roleSchema.optional" backend/src/routes/auth.routes.ts

      - name: Validate production OTP preflight behavior
        run: |
          TMP_ENV=$(mktemp)
          cat > "$TMP_ENV" <<'EOF'
          SMS_PROVIDER=mock
          EOF
          if ENV_FILE="$TMP_ENV" PROJECT_DIR="$PWD" bash scripts/verify-production-otp-config.sh; then
            echo 'mock provider unexpectedly passed production preflight'
            exit 1
          fi
          cat > "$TMP_ENV" <<'EOF'
          SMS_PROVIDER=twofactor
          TWOFACTOR_API_KEY=ci-placeholder
          TWOFACTOR_TEMPLATE_NAME=LOGIN_OTP
          EOF
          ENV_FILE="$TMP_ENV" PROJECT_DIR="$PWD" bash scripts/verify-production-otp-config.sh
          rm -f "$TMP_ENV"

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.js
          NODE_ENV=production SMS_PROVIDER=mock node - <<'NODE'
          const notifications = require('./dist/services/notification.service');
          try {
            notifications.assertSmsDeliveryConfigured();
            console.error('production mock SMS unexpectedly accepted');
            process.exit(1);
          } catch (error) {
            if (error.statusCode !== 503) throw error;
            console.log('production mock SMS correctly rejected');
          }
          NODE

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Start disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build disposable database through migration 019
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          for migration in 014_student_identity_enrollment.sql 015_realistic_demo_identities.sql 016_demo_academic_year_alignment.sql 017_school_management_core.sql 018_groups_collaboration.sql 019_parent_grievances.sql; do
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT role::text FROM users WHERE mobile='9200000001';")" = "TEACHER"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT role::text FROM users WHERE mobile='9000000000';")" = "SUPER_ADMIN"

      - name: Start compiled backend with mock SMS only in test
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: auth_hardening_ci_access_secret_2026
          JWT_REFRESH_SECRET: auth_hardening_ci_refresh_secret_2026
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          S3_BUCKET_NAME: vidyasetu-content
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-auth-hardening-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vidyasetu-auth-hardening-api.log
          exit 1

      - name: Certify OTP send and role isolation for every role
        run: |
          API=http://127.0.0.1:5000/api/v1
          check_send() {
            local mobile="$1" role="$2"
            body=$(curl -fsS -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d "{\"mobile\":\"$mobile\",\"role\":\"$role\"}")
            test "$(echo "$body" | jq -r '.data.otp | length')" = "6"
          }
          check_send 9300000001 STUDENT
          check_send 9400000001 PARENT
          check_send 9100000001 SCHOOL_ADMIN
          check_send 9200000001 TEACHER
          check_send 9000000000 SUPER_ADMIN

          code=$(curl -sS -o /tmp/wrong-role.json -w '%{http_code}' -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d '{"mobile":"9200000001","role":"SUPER_ADMIN"}')
          test "$code" = "400"
          grep -qi 'belongs to' /tmp/wrong-role.json

          code=$(curl -sS -o /tmp/unknown-admin.json -w '%{http_code}' -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d '{"mobile":"9999999998","role":"SUPER_ADMIN"}')
          test "$code" = "400"

          body=$(curl -fsS -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d '{"mobile":"9999999997","role":"STUDENT"}')
          test "$(echo "$body" | jq -r '.data.otp | length')" = "6"

      - name: Certify Teacher and Admin OTP verification
        run: |
          API=http://127.0.0.1:5000/api/v1
          teacher=$(curl -fsS -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d '{"mobile":"9200000001","role":"TEACHER"}')
          teacher_otp=$(echo "$teacher" | jq -r '.data.otp')
          verified=$(curl -fsS -X POST "$API/auth/verify-otp" -H 'Content-Type: application/json' -d "{\"mobile\":\"9200000001\",\"otp\":\"$teacher_otp\",\"role\":\"TEACHER\"}")
          test "$(echo "$verified" | jq -r '.data.user.role')" = "TEACHER"

          admin=$(curl -fsS -X POST "$API/auth/send-otp" -H 'Content-Type: application/json' -d '{"mobile":"9000000000","role":"SUPER_ADMIN"}')
          admin_otp=$(echo "$admin" | jq -r '.data.otp')
          verified=$(curl -fsS -X POST "$API/auth/verify-otp" -H 'Content-Type: application/json' -d "{\"mobile\":\"9000000000\",\"otp\":\"$admin_otp\",\"role\":\"SUPER_ADMIN\"}")
          test "$(echo "$verified" | jq -r '.data.user.role')" = "SUPER_ADMIN"

      - name: Start production frontend and smoke corrected public/admin routes
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          nohup npm start > /tmp/vidyasetu-auth-hardening-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          for route in / /login?role=teacher /login?role=admin /community /groups-info /for-students /for-schools /for-parents /platform-admin /admin/groups; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            echo "$route -> $code"
            [[ "$code" =~ ^(200|301|302|307|308)$ ]]
          done

      - name: Logs on failure
        if: failure()
        run: |
          cat /tmp/vidyasetu-auth-hardening-api.log 2>/dev/null || true
          cat /tmp/vidyasetu-auth-hardening-web.log 2>/dev/null || true
