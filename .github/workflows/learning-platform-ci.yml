name: Learning Platform Phase 1 CI

on:
  push:
    branches: [learning-platform-phase1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-platform-certification:
    name: Cross-board learning, source governance and public library E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Learning Platform contracts
        run: |
          bash -n scripts/learning-platform-e2e-smoke.sh
          test -s database/migrations/020_learning_platform_foundation.sql
          grep -q "VIDYASETU_ORIGINAL" database/migrations/020_learning_platform_foundation.sql
          grep -q "NROER" database/migrations/020_learning_platform_foundation.sql
          grep -q "requires_item_license_check" database/migrations/020_learning_platform_foundation.sql
          grep -q "\['Learn', '/learn'\]" frontend/src/components/layout/GlobalTopbar.tsx
          grep -q "Start learning on VidyaSetu" frontend/src/components/public/PublicHomeExperience.tsx
          test -s frontend/src/app/learn/page.tsx
          test -s 'frontend/src/app/learn/resource/[slug]/page.tsx'
          test -s 'frontend/src/app/(admin)/admin/learning/page.tsx'

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Start disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql

      - name: Apply Learning Platform migration twice to prove idempotence
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/020_learning_platform_foundation.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/020_learning_platform_foundation.sql

      - name: Validate Learning Platform database invariants
        env:
          PGPASSWORD: postgres
        run: |
          for table in education_boards curriculum_versions curriculum_subjects curriculum_units curriculum_topics learning_content_sources learning_resources learning_resource_boards learning_resource_reviews; do
            test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.$table') IS NOT NULL;")" = "t"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM learning_resources WHERE visibility='PUBLIC' AND review_status='PUBLISHED' AND source_id='83000000-0000-0000-0000-000000000001';")" -ge 8
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT requires_item_license_check FROM learning_content_sources WHERE code='NROER';")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT allow_rehosting_default FROM learning_content_sources WHERE code='NROER';")" = "f"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM education_boards WHERE is_active=TRUE;")" -ge 10

      - name: Start compiled backend
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: learning_platform_ci_access_secret_2026
          JWT_REFRESH_SECRET: learning_platform_ci_refresh_secret_2026
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          OTP_EXPIRY_MINUTES: '10'
          OTP_MAX_ATTEMPTS: '3'
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          S3_BUCKET_NAME: vidyasetu-content
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-learning-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vidyasetu-learning-api.log
          exit 1

      - name: Run Learning Platform E2E
        env:
          API_BASE: http://127.0.0.1:5000/api/v1
        run: bash scripts/learning-platform-e2e-smoke.sh

      - name: Start compiled frontend and smoke Learning routes
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          nohup npm start > /tmp/vidyasetu-learning-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          for route in / /learn /learn/resource/progress-not-perfection /admin/learning /student; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")"
            printf '%-48s %s\n' "$route" "$code"
            [[ "$code" =~ ^(200|301|302|307|308)$ ]]
          done

      - name: Application logs on failure
        if: failure()
        run: |
          cat /tmp/vidyasetu-learning-api.log 2>/dev/null || true
          cat /tmp/vidyasetu-learning-web.log 2>/dev/null || true
