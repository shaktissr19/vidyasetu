name: School Module Finalization CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-finalization:
    name: School UI, API, database and notification certification
    runs-on: ubuntu-22.04
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate School finalization contracts
        run: |
          set -euxo pipefail
          test -s database/migrations/043_school_module_finalization.sql
          grep -q "dedupe_key" database/migrations/043_school_module_finalization.sql
          grep -q "action_path" database/migrations/043_school_module_finalization.sql
          test -s backend/src/constants/schoolGrades.ts
          test -s backend/src/services/notificationInbox.service.ts
          test -s backend/src/controllers/notificationInbox.controller.ts
          test -s backend/src/routes/notificationInbox.routes.ts
          test -s backend/src/scripts/certifySchoolModuleFinalization.ts
          test -s frontend/src/lib/schoolGrades.ts
          test -s frontend/src/services/notificationService.ts
          test -s frontend/src/app/notifications/page.tsx
          grep -q "PN" backend/src/constants/schoolGrades.ts
          grep -q "NURSERY" backend/src/constants/schoolGrades.ts
          grep -q "UKG" backend/src/constants/schoolGrades.ts
          grep -q "notifications" backend/src/index.ts
          grep -q "notification-unread-count" frontend/src/components/layout/GlobalTopbar.tsx
          grep -q "SCHOOL_GRADES" 'frontend/src/app/(school)/school/classes/page.tsx'
          grep -q "schoolGradeLabel" 'frontend/src/app/(school)/school/exams/page.tsx'
          grep -q "schoolGradeLabel" 'frontend/src/app/(school)/school/announcements/page.tsx'
          for page in overview enrollments students classes teachers staff transport documents academic-workspace learning-insights ptm attendance absence fees timetable homework exams results announcements grievances groups profile onboarding; do
            test -s "frontend/src/app/(school)/school/$page/page.tsx"
          done

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/services/notificationInbox.service.js
          test -s dist/controllers/notificationInbox.controller.js
          test -s dist/scripts/certifySchoolModuleFinalization.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Install disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='vidyasetu_db'" | grep -q 1 || sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build complete disposable School baseline
        env:
          PGPASSWORD: postgres
        run: |
          set -euxo pipefail
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/04_student_seed_validate.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          for migration in \
            014_student_identity_enrollment.sql \
            015_realistic_demo_identities.sql \
            016_demo_academic_year_alignment.sql \
            017_school_management_core.sql \
            018_groups_collaboration.sql \
            019_parent_grievances.sql \
            020_learning_platform_foundation.sql \
            021_learning_original_academic_starter.sql \
            022_learning_practice_personalization.sql \
            023_global_learning_bulk_importer.sql \
            024_student_global_grade_sync.sql \
            026_learning_concepts_mastery.sql \
            027_student_concept_mastery_runtime.sql \
            028_grounded_ai_doubt_resolution.sql \
            029_absence_school_calendar.sql \
            029_homework_student_notifications.sql \
            030_staff_attendance_leave.sql \
            031_school_transport_safety.sql \
            032_student_records_certificates.sql \
            033_school_library_circulation.sql \
            035_remove_physical_library.sql \
            036_learning_content_quality_governance.sql \
            037_diagnostic_assessment_intelligence.sql \
            038_diagnostic_evidence_role_bridge.sql \
            039_personalized_adaptive_learning_v2.sql \
            040_competition_platform_v2.sql \
            041_learning_support_v2.sql; do
              echo "Applying $migration"
              psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done

      - name: Apply School finalization migration twice
        env:
          PGPASSWORD: postgres
        run: |
          set -euxo pipefail
          for pass in 1 2; do
            echo "School finalization migration pass $pass"
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/043_school_module_finalization.sql
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='notifications' AND column_name='dedupe_key');")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='notifications' AND column_name='action_path');")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.uq_notifications_user_dedupe') IS NOT NULL;")" = "t"

      - name: Run School finalization behavioral certification
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: node dist/scripts/certifySchoolModuleFinalization.js
