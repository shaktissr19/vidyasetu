name: School Transport and Pickup Safety CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-safety-certification:
    name: Routes, assignments, pickup/drop safety and family visibility
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate transport contracts
        run: |
          set -Eeuo pipefail
          test -s database/migrations/031_school_transport_safety.sql
          grep -q "transport_vehicles" database/migrations/031_school_transport_safety.sql
          grep -q "student_transport_assignments" database/migrations/031_school_transport_safety.sql
          grep -q "transport_student_events" database/migrations/031_school_transport_safety.sql
          grep -q "schoolTransportRoutes" backend/src/index.ts
          grep -q "studentTransportRoutes" backend/src/index.ts
          grep -q "parentTransportRoutes" backend/src/index.ts
          grep -q "Transport & Pickup Safety" 'frontend/src/app/(school)/school/transport/page.tsx'
          grep -q "Transport & Safety" 'frontend/src/app/(parent)/parent/transport/page.tsx'
          grep -q "TransportSection" frontend/src/components/student/StudentPortal.tsx
          grep -q "does not claim live GPS" 'frontend/src/app/(school)/school/transport/page.tsx'
          if grep -Eqi 'live[ -]?gps|current_lat|current_long|current_location' database/migrations/031_school_transport_safety.sql; then
            echo 'Transport schema must not claim live GPS tracking.'
            exit 1
          fi

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/services/transport.service.js
          test -s dist/scripts/certifyTransportSafety.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Install disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build disposable School, Student and Parent baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/04_student_seed_validate.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          for migration in \
            014_student_identity_enrollment.sql \
            015_realistic_demo_identities.sql \
            016_demo_academic_year_alignment.sql \
            017_school_management_core.sql; do
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done

      - name: Apply transport migration twice
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          for pass in 1 2; do
            echo "Transport migration pass $pass"
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/031_school_transport_safety.sql
          done
          for table in transport_vehicles transport_routes transport_stops student_transport_assignments transport_student_events; do
            test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.${table}') IS NOT NULL;")" = "t"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT EXISTS(SELECT 1 FROM pg_enum e JOIN pg_type t ON t.oid=e.enumtypid WHERE t.typname='transport_event_type' AND e.enumlabel='DROPPED_HOME');")" = "t"

      - name: Certify School transport and pickup safety behavior
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
        run: node dist/scripts/certifyTransportSafety.js
