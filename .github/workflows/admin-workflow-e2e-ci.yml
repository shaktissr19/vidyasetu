name: Admin Workflow E2E CI

on:
  push:
    branches: [feature/admin-workflow-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-workflow-certification:
    name: Admin workflow contract and production builds
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Certify Admin workflow contract
        run: |
          bash scripts/admin-workflow-contract-smoke.sh
          bash -n scripts/admin-workflow-e2e-smoke.sh
          bash -n scripts/parent-admin-production-smoke.sh

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f dist/index.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
