name: Remove Physical Library CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-library-retirement:
    name: Retire circulation and preserve digital Learning Library
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate product boundary
        run: |
          set -Eeuo pipefail
          test -s database/migrations/033_school_library_circulation.sql
          test -s database/migrations/035_remove_physical_library.sql
          test -d frontend/src/app/learn/library
          test -s frontend/src/app/learn/library/page.tsx
          test ! -e backend/src/services/library.service.ts
          test ! -e backend/src/controllers/library.controller.ts
          test ! -e backend/src/routes/schoolLibrary.routes.ts
          test ! -e backend/src/routes/studentLibrary.routes.ts
          test ! -e backend/src/routes/parentLibrary.routes.ts
          test ! -e frontend/src/services/libraryService.ts
          test ! -e 'frontend/src/app/(school)/school/library/page.tsx'
          test ! -e 'frontend/src/app/(parent)/parent/library/page.tsx'
          test ! -e frontend/src/components/student/sections/LibrarySection.tsx
          ! grep -q 'schoolLibraryRoutes\|studentLibraryRoutes\|parentLibraryRoutes' backend/src/index.ts
          ! grep -q "'library'.*My Library\|LibrarySection" frontend/src/components/student/StudentPortal.tsx
          grep -q "router.push(href, { scroll: false })" frontend/src/components/student/StudentPortal.tsx

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Install disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres

      - name: Build disposable baseline
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          for migration in 014_student_identity_enrollment.sql 015_realistic_demo_identities.sql 016_demo_academic_year_alignment.sql 017_school_management_core.sql; do
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done

      - name: Prove forward retirement is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/033_school_library_circulation.sql
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_books') IS NOT NULL;")" = "t"
          for pass in 1 2; do
            echo "Physical Library retirement pass $pass"
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/035_remove_physical_library.sql
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_books') IS NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_book_copies') IS NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_staff_access') IS NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_loans') IS NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regtype('public.library_copy_status') IS NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regtype('public.library_loan_status') IS NULL;")" = "t"
