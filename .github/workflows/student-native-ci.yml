name: Student Native CI

on:
  push:
    branches: [phase1-student-foundation]
  workflow_dispatch:

jobs:
  student-native-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start native PostgreSQL and Redis
        run: |
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='vidyasetu_db'" | grep -q 1 || sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping

      - name: Build VidyaSetu database from SQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/04_student_seed_validate.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql

      - name: Install and syntax-check backend
        working-directory: backend
        run: |
          npm ci
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Start backend natively
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci_access_secret_vidyasetu_2026
          JWT_REFRESH_SECRET: ci_refresh_secret_vidyasetu_2026
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          OTP_EXPIRY_MINUTES: '10'
          OTP_MAX_ATTEMPTS: '3'
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vidyasetu-backend.log
          exit 1

      - name: Verify seeded Student identity and dashboard
        run: |
          set -euo pipefail
          SEND=$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/send-otp -H 'Content-Type: application/json' -d '{"mobile":"9300000001"}')
          OTP=$(echo "$SEND" | jq -r '.data.otp')
          LOGIN=$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/verify-otp -H 'Content-Type: application/json' -d "{\"mobile\":\"9300000001\",\"otp\":\"$OTP\"}")
          TOKEN=$(echo "$LOGIN" | jq -r '.data.accessToken')
          test -n "$TOKEN" && test "$TOKEN" != "null"

          STATUS=$(curl -fsS http://127.0.0.1:5000/api/v1/student/profile/status -H "Authorization: Bearer $TOKEN")
          test "$(echo "$STATUS" | jq -r '.data.complete')" = "true"
          test "$(echo "$STATUS" | jq -r '.data.profile.mobile')" = "9300000001"

          DASH=$(curl -fsS http://127.0.0.1:5000/api/v1/student/dashboard -H "Authorization: Bearer $TOKEN")
          test "$(echo "$DASH" | jq -r '.data.student.mobile')" = "9300000001"
          test "$(echo "$DASH" | jq -r '.data.student.schoolName')" != "null"
          test "$(echo "$DASH" | jq -r '.data.student.className')" != "null"

          curl -fsS http://127.0.0.1:5000/api/v1/student/attendance/2026/8 -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -fsS http://127.0.0.1:5000/api/v1/student/badges -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -fsS 'http://127.0.0.1:5000/api/v1/student/leaderboard?scope=class' -H "Authorization: Bearer $TOKEN" >/dev/null
          curl -fsS http://127.0.0.1:5000/api/v1/student/report-card -H "Authorization: Bearer $TOKEN" >/dev/null

      - name: Verify new Student profile completion E2E
        run: |
          set -euo pipefail
          MOBILE=9399999999
          SEND=$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/send-otp -H 'Content-Type: application/json' -d "{\"mobile\":\"$MOBILE\"}")
          OTP=$(echo "$SEND" | jq -r '.data.otp')
          LOGIN=$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/verify-otp -H 'Content-Type: application/json' -d "{\"mobile\":\"$MOBILE\",\"otp\":\"$OTP\"}")
          TOKEN=$(echo "$LOGIN" | jq -r '.data.accessToken')

          BEFORE=$(curl -fsS http://127.0.0.1:5000/api/v1/student/profile/status -H "Authorization: Bearer $TOKEN")
          test "$(echo "$BEFORE" | jq -r '.data.complete')" = "false"

          OPTIONS=$(curl -fsS http://127.0.0.1:5000/api/v1/student/profile/setup-options -H "Authorization: Bearer $TOKEN")
          SCHOOL_ID=$(echo "$OPTIONS" | jq -r '.data.schools[0].id')
          CLASS_ID=$(echo "$OPTIONS" | jq -r '.data.schools[0].classes[0].id')
          test -n "$SCHOOL_ID" && test "$SCHOOL_ID" != "null"
          test -n "$CLASS_ID" && test "$CLASS_ID" != "null"

          COMPLETE=$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/student/profile/complete \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Student\",\"language\":\"en\",\"schoolId\":\"$SCHOOL_ID\",\"classId\":\"$CLASS_ID\"}")
          test "$(echo "$COMPLETE" | jq -r '.data.student.mobile')" = "$MOBILE"

          AFTER=$(curl -fsS http://127.0.0.1:5000/api/v1/student/profile/status -H "Authorization: Bearer $TOKEN")
          test "$(echo "$AFTER" | jq -r '.data.complete')" = "true"
          curl -fsS http://127.0.0.1:5000/api/v1/student/dashboard -H "Authorization: Bearer $TOKEN" >/dev/null

      - name: Install and build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm ci
          npm run build

      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/vidyasetu-backend.log || true
