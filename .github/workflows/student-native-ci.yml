name: Student Native CI

on:
  push:
    branches: [student-e2e-identity, phase1-student-foundation, typescript-migration, main]
  workflow_dispatch:

jobs:
  student-native-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate release scripts
        run: |
          bash -n scripts/native-vps-cutover.sh
          bash -n scripts/native-vps-resume.sh
          bash -n scripts/deploy-main-native.sh
          bash -n scripts/student-e2e-smoke.sh
          bash -n scripts/student-production-smoke.sh
          grep -q '014_student_identity_enrollment.sql' scripts/deploy-main-native.sh
          grep -q 'student-production-smoke.sh' scripts/deploy-main-native.sh
          if grep -Eq 'docker compose down.*-v|docker-compose down.*-v' scripts/deploy-main-native.sh; then
            echo 'Destructive Docker volume deletion is forbidden in deployment scripts.'
            exit 1
          fi

      - name: Install and start native PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='vidyasetu_db'" | grep -q 1 || sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build database and apply Student identity migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/04_student_seed_validate.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/014_student_identity_enrollment.sql
          # Migration must be safe to re-run against an existing production database.
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/014_student_identity_enrollment.sql

      - name: Validate identity and enrollment schema
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM users WHERE username IS NULL OR BTRIM(username)='';")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM students WHERE student_code IS NULL OR BTRIM(student_code)='';")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM (SELECT LOWER(username) FROM users GROUP BY LOWER(username) HAVING COUNT(*)>1) x;")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM (SELECT student_code FROM students GROUP BY student_code HAVING COUNT(*)>1) x;")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.student_school_requests') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.parent_link_requests') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM students WHERE school_id IS NOT NULL AND school_link_status <> 'APPROVED';")" = "0"

      - name: Build shared contracts and compiled backend
        run: |
          cd shared/contracts
          npm install --no-audit --no-fund
          npm run build
          cd ../../backend
          npm ci
          npm run typecheck
          npm run build
          test -f dist/index.js
          find src -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Start backend natively
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci_access_secret_vidyasetu_2026
          JWT_REFRESH_SECRET: ci_refresh_secret_vidyasetu_2026
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          OTP_EXPIRY_MINUTES: '10'
          OTP_MAX_ATTEMPTS: '3'
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          S3_BUCKET_NAME: vidyasetu-content
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vidyasetu-backend.log
          exit 1

      - name: Complete Student API E2E
        env:
          API_BASE: http://127.0.0.1:5000/api/v1
          CI_MOBILE: '9399999999'
          CI_EMAIL: ci.student@vidyasetu.test
          CI_USERNAME: ci.student
          CI_PASSWORD: Student12345
          CI_RESET_PASSWORD: Student54321
        run: bash scripts/student-e2e-smoke.sh

      - name: Validate Student database invariants after E2E
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -c "
          SELECT u.mobile, u.username, u.email, s.student_code, s.school_link_status,
                 s.roll_number, sch.name AS school, sc.class_name, sc.section
          FROM users u
          JOIN students s ON s.user_id = u.id
          LEFT JOIN schools sch ON sch.id = s.school_id
          LEFT JOIN school_classes sc ON sc.id = s.class_id
          WHERE u.mobile='9399999999';"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM users u JOIN students s ON s.user_id=u.id WHERE u.mobile='9399999999' AND u.username='ci.student' AND u.email='ci.student@vidyasetu.test' AND u.password_hash IS NOT NULL AND s.school_link_status='APPROVED' AND s.roll_number='CI8A99';")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM student_school_requests r JOIN students s ON s.id=r.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999' AND r.status='APPROVED';")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM parent_student_links p JOIN students s ON s.id=p.student_id JOIN users u ON u.id=s.user_id JOIN users pu ON pu.id=p.parent_user_id WHERE u.mobile='9399999999' AND pu.mobile='9400000001';")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM exam_attempts ea JOIN students s ON s.id=ea.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999' AND ea.status='SCORED';")" -ge 1
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM doubts d JOIN students s ON s.id=d.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999' AND d.status='RESOLVED';")" -ge 1
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM attendance a JOIN students s ON s.id=a.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999' AND a.status='PRESENT';")" -ge 1
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM student_content_progress p JOIN students s ON s.id=p.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999' AND p.is_completed=TRUE;")" -ge 2
          # XP is retained only as legacy storage. The new Student flow must not create XP events.
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM xp_events x JOIN students s ON s.id=x.student_id JOIN users u ON u.id=s.user_id WHERE u.mobile='9399999999';")" = "0"

      - name: Install and build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          unset NODE_ENV || true
          rm -rf .next node_modules
          npm install --no-audit --no-fund
          NODE_ENV=production npm run build

      - name: Start production Next.js and verify canonical routes
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          nohup npm start > /tmp/vidyasetu-frontend.log 2>&1 &
          for i in {1..30}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/student || true)"
            if [[ "$code" =~ ^(200|301|302|307|308)$ ]]; then break; fi
            sleep 1
            [[ "$i" -lt 30 ]] || { cat /tmp/vidyasetu-frontend.log; exit 1; }
          done
          for path in / /login /register /student /school/enrollments /school/overview /school/students /parent/dashboard /admin/analytics; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")"
            echo "$path -> $code"
            [[ "$code" =~ ^(200|301|302|307|308)$ ]] || exit 1
          done

      - name: Application logs on failure
        if: failure()
        run: |
          echo '--- Backend ---'
          cat /tmp/vidyasetu-backend.log || true
          echo '--- Frontend ---'
          cat /tmp/vidyasetu-frontend.log || true
