name: Content Factory 2.0 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-factory-foundation:
    name: Curriculum, source intake and pack foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Content Factory contracts
        run: |
          set -euxo pipefail
          test -s database/migrations/048_learning_content_factory_foundation.sql
          grep -q "learning_content_packs" database/migrations/048_learning_content_factory_foundation.sql
          grep -q "learning_content_pack_items" database/migrations/048_learning_content_factory_foundation.sql
          grep -q "EXTERNAL_WEB" database/migrations/048_learning_content_factory_foundation.sql
          grep -q "WATCH" database/migrations/048_learning_content_factory_foundation.sql
          grep -q "LISTEN" database/migrations/048_learning_content_factory_foundation.sql
          grep -q "EXPLORE" database/migrations/048_learning_content_factory_foundation.sql
          test -s backend/src/services/adminContentFactory.service.ts
          test -s backend/src/controllers/adminContentFactory.controller.ts
          test -s backend/src/routes/adminContentFactory.routes.ts
          grep -q "authorize('SUPER_ADMIN')" backend/src/routes/adminContentFactory.routes.ts
          grep -q "stageExternalWebSource" backend/src/services/adminContentFactory.service.ts
          grep -q "Private or local network URLs are not allowed" backend/src/services/adminContentFactory.service.ts
          grep -q "/admin/learning/factory" backend/src/index.ts
          test -s frontend/src/services/contentFactoryService.ts
          test -s 'frontend/src/app/(admin)/admin/learning/factory/page.tsx'
          grep -q "Search Learning Content" 'frontend/src/app/(admin)/admin/learning/factory/page.tsx'
          grep -q "Paste any external web address" 'frontend/src/app/(admin)/admin/learning/factory/page.tsx'
          grep -q "Content Factory" 'frontend/src/app/(admin)/layout.tsx'
          test -s docs/content-factory-2-design.md

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.js
          test -s dist/services/adminContentFactory.service.js
          test -s dist/controllers/adminContentFactory.controller.js
          test -s dist/routes/adminContentFactory.routes.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Start disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build disposable database through migration 048
        env:
          PGPASSWORD: postgres
        run: |
          set -euxo pipefail
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          for migration in \
            014_student_identity_enrollment.sql \
            020_learning_platform_foundation.sql \
            021_learning_original_academic_starter.sql \
            022_learning_practice_personalization.sql \
            023_global_learning_bulk_importer.sql \
            024_student_global_grade_sync.sql \
            026_learning_concepts_mastery.sql \
            027_student_concept_mastery_runtime.sql \
            028_grounded_ai_doubt_resolution.sql \
            036_learning_content_quality_governance.sql \
            044_learning_entitlements_canonical_runtime.sql \
            045_learning_ai_content_creator.sql \
            046_learning_creator_source_discovery.sql \
            047_learning_source_registry_video_discovery.sql \
            048_learning_content_factory_foundation.sql; do
              echo "Applying $migration"
              psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
          echo "Re-applying migration 048 to prove idempotence"
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/048_learning_content_factory_foundation.sql

      - name: Validate Content Factory database invariants
        env:
          PGPASSWORD: postgres
        run: |
          set -euxo pipefail
          PSQL="psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc"
          test "$($PSQL "SELECT to_regclass('public.learning_content_packs') IS NOT NULL;")" = "t"
          test "$($PSQL "SELECT to_regclass('public.learning_content_pack_items') IS NOT NULL;")" = "t"
          test "$($PSQL "SELECT COUNT(*) FROM learning_content_sources WHERE code='EXTERNAL_WEB' AND is_active=TRUE;")" = "1"
          test "$($PSQL "SELECT default_license::text FROM learning_content_sources WHERE code='EXTERNAL_WEB';")" = "EXTERNAL_LINK_ONLY"
          test "$($PSQL "SELECT requires_item_license_check FROM learning_content_sources WHERE code='EXTERNAL_WEB';")" = "t"
          test "$($PSQL "SELECT EXISTS(SELECT 1 FROM pg_constraint WHERE conrelid='learning_content_packs'::regclass AND pg_get_constraintdef(oid) LIKE '%WATCH%LISTEN%EXPLORE%');")" = "t"

      - name: Start compiled backend in safe mock mode
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: factory_ci_access_secret_2026
          JWT_REFRESH_SECRET: factory_ci_refresh_secret_2026
          JWT_ACCESS_EXPIRY: 10m
          JWT_REFRESH_EXPIRY: 30d
          OTP_EXPIRY_MINUTES: '10'
          OTP_MAX_ATTEMPTS: '3'
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          DIKSHA_DISCOVERY_ENABLED: 'false'
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          S3_BUCKET_NAME: vidyasetu-content
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-content-factory-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vidyasetu-content-factory-api.log
          exit 1

      - name: Validate factory authorization and options API
        run: |
          set -euxo pipefail
          test "$(curl -sS -o /tmp/factory-unauth.json -w '%{http_code}' http://127.0.0.1:5000/api/v1/admin/learning/factory/options)" = "401"
          SEND="$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/send-otp -H 'Content-Type: application/json' -d '{"mobile":"9000000000","role":"SUPER_ADMIN"}')"
          OTP="$(jq -er '.data.otp' <<<"$SEND")"
          VERIFY="$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/auth/verify-otp -H 'Content-Type: application/json' -d "{\"mobile\":\"9000000000\",\"otp\":\"$OTP\",\"role\":\"SUPER_ADMIN\"}")"
          TOKEN="$(jq -er '.data.accessToken' <<<"$VERIFY")"
          OPTIONS="$(curl -fsS http://127.0.0.1:5000/api/v1/admin/learning/factory/options -H "Authorization: Bearer $TOKEN")"
          jq -e '.data.boards|length>=1' <<<"$OPTIONS" >/dev/null
          jq -e '.data.readinessByClass|length==12' <<<"$OPTIONS" >/dev/null
          jq -e '.data.workflow.publication|length>0' <<<"$OPTIONS" >/dev/null

          WEB="$(curl -fsS -X POST http://127.0.0.1:5000/api/v1/admin/learning/factory/external-web-source -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"CI external learning reference","sourceUrl":"https://example.com/education/resource","classNumber":5,"subject":"Science","boardCode":"COMMON"}')"
          jq -e '.data.kind=="OER_INTAKE" and .data.sourceCode=="EXTERNAL_WEB" and .data.licenceCandidate=="EXTERNAL_LINK_ONLY"' <<<"$WEB" >/dev/null

          test "$(curl -sS -o /tmp/factory-private-url.json -w '%{http_code}' -X POST http://127.0.0.1:5000/api/v1/admin/learning/factory/external-web-source -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"Blocked private URL","sourceUrl":"https://127.0.0.1/private"}')" = "400"
