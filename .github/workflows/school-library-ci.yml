name: School Library CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-certification:
    name: Catalogue, circulation, role access and family visibility
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Library contracts
        run: |
          set -Eeuo pipefail
          test -s database/migrations/033_school_library_circulation.sql
          grep -q "library_books" database/migrations/033_school_library_circulation.sql
          grep -q "library_book_copies" database/migrations/033_school_library_circulation.sql
          grep -q "library_staff_access" database/migrations/033_school_library_circulation.sql
          grep -q "library_loans" database/migrations/033_school_library_circulation.sql
          grep -q "requireCirculationAccess" backend/src/services/library.service.ts
          grep -q "schoolLibraryRoutes" backend/src/index.ts
          grep -q "studentLibraryRoutes" backend/src/index.ts
          grep -q "parentLibraryRoutes" backend/src/index.ts
          grep -q "School Library" 'frontend/src/app/(school)/school/library/page.tsx'
          grep -q "My Library" frontend/src/components/student/StudentPortal.tsx
          grep -q "Child Library" 'frontend/src/app/(parent)/parent/library/page.tsx'
      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.d.ts
      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/services/library.service.js
          test -s dist/controllers/library.controller.js
      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID
      - name: Install disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
      - name: Build disposable baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          for migration in 014_student_identity_enrollment.sql 015_realistic_demo_identities.sql 016_demo_academic_year_alignment.sql 017_school_management_core.sql; do
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Apply Library migration twice
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          for pass in 1 2; do
            echo "Library migration pass $pass"
            psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/033_school_library_circulation.sql
          done
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_books') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_book_copies') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_staff_access') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT to_regclass('public.library_loans') IS NOT NULL;")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM pg_indexes WHERE indexname='uq_library_active_copy_loan';")" = "1"
