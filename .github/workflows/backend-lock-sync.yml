name: One-time backend lockfile sync

on:
  push:
    branches: [typescript-migration]
    paths:
      - '.github/workflows/backend-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: typescript-migration

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile from package manifest
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove npm ci accepts the regenerated lockfile
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit only the regenerated backend lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo 'backend/package-lock.json is already synchronized.'
            exit 0
          fi
          git commit -m 'Sync backend lockfile for TypeScript toolchain'
          git push origin HEAD:typescript-migration
