name: Content Pack CI

on:
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/validate-content-pack.mjs'
      - '.github/workflows/content-pack-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'scripts/validate-content-pack.mjs'
      - '.github/workflows/content-pack-ci.yml'

permissions:
  contents: read

jobs:
  validate-content-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate bilingual learning packs
        run: node scripts/validate-content-pack.mjs content
