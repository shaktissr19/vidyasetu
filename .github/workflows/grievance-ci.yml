name: Parent Grievance Centre CI

on:
  push:
    branches: [parent-grievance-centre]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grievance-certification:
    name: Parent to School to Platform Admin grievance E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate grievance smoke syntax
        run: bash -n scripts/grievance-e2e-smoke.sh

      - name: Build shared contracts
        working-directory: shared/contracts
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.d.ts

      - name: Typecheck and compile backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.js

      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          test -s .next/BUILD_ID

      - name: Start disposable PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server jq
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb vidyasetu_db
          pg_isready -h 127.0.0.1 -U postgres
          redis-cli ping | grep -q PONG

      - name: Build disposable database through Groups
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/run_all_migrations.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/dev_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/03_student_seed_reconcile.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/seeds/05_student_module_seed.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/014_student_identity_enrollment.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/015_realistic_demo_identities.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/016_demo_academic_year_alignment.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/017_school_management_core.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/018_groups_collaboration.sql

      - name: Apply grievance migration twice to prove idempotence
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/019_parent_grievances.sql
          psql -h 127.0.0.1 -U postgres -d vidyasetu_db -v ON_ERROR_STOP=1 -f database/migrations/019_parent_grievances.sql
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM platform_config WHERE key IN ('GRIEVANCES_ENABLED','GRIEVANCE_DEFAULT_SLA_HOURS','GRIEVANCE_REOPEN_LIMIT');")" = "3"
          test "$(psql -h 127.0.0.1 -U postgres -d vidyasetu_db -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('parent_grievances','grievance_messages','grievance_attachments','grievance_history');")" = "4"

      - name: Start compiled backend
        working-directory: backend
        env:
          PORT: '5000'
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: grievance_ci_access_secret_2026
          JWT_REFRESH_SECRET: grievance_ci_refresh_secret_2026
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 30d
          SMS_PROVIDER: mock
          WHATSAPP_PROVIDER: mock
          AI_PROVIDER: mock
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          S3_BUCKET_NAME: vidyasetu-content
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/vidyasetu-grievance-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vidyasetu-grievance-api.log
          exit 1

      - name: Run full grievance lifecycle and isolation E2E
        env:
          API_BASE: http://127.0.0.1:5000/api/v1
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: vidyasetu_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: bash scripts/grievance-e2e-smoke.sh

      - name: Start production frontend and smoke grievance pages
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:5000/api/v1
        run: |
          nohup npm start > /tmp/vidyasetu-grievance-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          for route in /for-parents /parent/grievances /school/grievances /admin/grievances; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            [[ "$code" =~ ^(200|301|302|307|308)$ ]]
          done

      - name: API logs on failure
        if: failure()
        run: cat /tmp/vidyasetu-grievance-api.log 2>/dev/null || true
