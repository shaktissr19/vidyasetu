<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear Equations</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 22px;color:#0d1b3e;line-height:1.7}h1{color:#ff6b00}.step{background:#fff3e8;padding:14px;margin:10px 0;border-radius:12px}</style></head><body><h1>Linear Equations in One Variable</h1><p>Goal: keep the variable on one side and constants on the other.</p><div class="step">2x + 6 = 14</div><div class="step">2x = 14 - 6 = 8</div><div class="step">x = 8 ÷ 2 = 4</div><p>Verify by putting x = 4 back into the original equation.</p></body></html>
